<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor Satker - SI-BARISAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .mhead {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        flex-wrap: wrap;
        padding: 0.8rem 1rem;
        background: var(--ft);
        color: #fff;
        border-bottom: 3px solid var(--c);
      }
      .mhead .button.line {
        color: #fff;
      }
      .mhead strong {
        font-size: 1rem;
        letter-spacing: 0.04em;
      }
      #mwho {
        font-size: 0.78rem;
        opacity: 0.9;
      }
      .mright {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      #laporan.section {
        padding-top: 2rem;
      }

      /* Dropdown pilihan jenis satuan kerja (kanan atas, sejajar tombol Excel) */
      .tools .filt-sel {
        margin-left: auto;
        display: block;
      }
      .filt-sel select {
        min-width: 13rem;
        padding: 0.7rem 2.2rem 0.7rem 1rem;
        border: 2px solid var(--c);
        border-radius: 0.5rem;
        background-color: var(--bg);
        color: var(--t);
        font: 600 0.8rem inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .filt-sel select option {
        background: var(--bg);
        color: var(--t);
      }

      /* Ringkasan di atas tabel */
      .ringkas {
        margin: 0 0 0.6rem;
        font-size: 0.82rem;
        color: var(--t2);
      }

      /* Tabel lebih rapi */
      .tw {
        max-height: 70vh;
        overflow: auto;
        border-radius: 0.6rem;
      }
      #laporan th {
        position: sticky;
        top: 0;
        z-index: 1;
        white-space: nowrap;
      }
      #laporan td {
        vertical-align: middle;
      }
      #laporan tbody tr:nth-child(even) {
        background: rgba(128, 128, 128, 0.08);
      }
      #laporan tbody tr:hover {
        background: rgba(197, 217, 45, 0.2);
      }
      #laporan th:nth-child(3),
      #laporan td:nth-child(3),
      #laporan th:nth-child(n + 5),
      #laporan td:nth-child(n + 5) {
        text-align: center;
      }
      @media (max-width: 640px) {
        .tools .filt-sel {
          margin-left: 0;
          width: 100%;
        }
        .filt-sel select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="mhead">
      <a class="button line" href="index.html#laporan">&larr; Kembali ke aplikasi</a>
      <strong>SI-BARISAN</strong>
      <div class="mright">
        <span id="mwho"></span>
        <button class="button line" id="mtema" type="button">Mode gelap</button>
      </div>
    </header>

    <main>
      <section class="section" id="laporan">
        <h2 class="section__title">Monitor Satker</h2>
        <div class="container">
          <div class="tbox">
            <div class="pita-sulapa" aria-hidden="true"></div>
            <div class="tools">
              <button class="button line" id="csv" type="button">Unduh Excel</button>
              <button class="button line" id="muat" type="button">Muat ulang</button>
              <label class="filt-sel">
                <select id="filt" aria-label="Pilih jenis satuan kerja">
                  <option value="Semua">Semua jenis</option>
                  <option value="Kanwil">Kanwil</option>
                  <option value="Kankemenag">Kankemenag</option>
                  <option value="KUA">KUA</option>
                  <option value="MIN">MIN</option>
                  <option value="MTsN">MTsN</option>
                  <option value="MAN">MAN</option>
                </select>
              </label>
            </div>
            <p class="drive-note" id="info" role="status"></p>
            <p class="ringkas" id="ringkas" aria-live="polite"></p>
            <div class="tw">
              <table>
                <thead>
                  <tr>
                    <th>Tanggal</th>
                    <th>Satuan kerja</th>
                    <th>Jalur</th>
                    <th>Kab/Kota</th>
                    <th>NB</th>
                    <th>NS</th>
                    <th>NK</th>
                    <th>NT</th>
                    <th>IGBS</th>
                    <th>Kategori</th>
                    <th>Drive</th>
                  </tr>
                </thead>
                <tbody id="tb"></tbody>
              </table>
            </div>
            <p class="empty" id="em">Belum ada penilaian.</p>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="wilayah.js"></script>
    <script src="monitor.js"></script>
  </body>
</html>
